name: Recall CI

on:
  pull_request:
  push:
    branches:
      - main
      - release/**
  workflow_dispatch:

jobs:
  windows-ci:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Create worker test virtualenv
        working-directory: python
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install ".[ml]"

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Prepare Tauri resource placeholder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri\resources\python | Out-Null
          Set-Content -Path src-tauri\resources\python\run_worker.py -Value "# CI cargo-check placeholder" -Encoding utf8

      - name: Check Rust host
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Run Python tests
        shell: pwsh
        run: |
          $env:Path = "$(Resolve-Path python\.venv\Scripts);$env:Path"
          npm run test:python
