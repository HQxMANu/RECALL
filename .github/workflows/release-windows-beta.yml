name: Build Windows Portable Release Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      sign_artifacts:
        description: Sign the portable executable bundle (optional future enhancement)
        required: true
        default: false
        type: boolean
      publish_github_release:
        description: Publish a GitHub Release from this run
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  windows-beta:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2

      - name: Cache Recall model assets
        uses: actions/cache@v4
        with:
          path: python/models
          key: recall-core-models-v1-${{ runner.os }}-${{ hashFiles('scripts/prepare_local_models.py') }}
          restore-keys: |
            recall-core-models-v1-${{ runner.os }}-

      - name: Install frontend dependencies
        run: npm ci

      - name: Create packaged worker virtualenv
        working-directory: python
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install ".[ml]"

      - name: Lint frontend
        run: npm run lint

      - name: Prepare bundled worker runtime
        shell: pwsh
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          $env:Path = "$(Resolve-Path python\.venv\Scripts);$env:Path"
          python -c "import sys; print(sys.executable)"
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            npm run build:runtime
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            if ($attempt -eq 4) {
              exit $LASTEXITCODE
            }
            $delaySeconds = [Math]::Min(300, 30 * $attempt * $attempt)
            Write-Warning "Runtime preparation failed on attempt $attempt. Retrying in $delaySeconds seconds."
            Start-Sleep -Seconds $delaySeconds
          }

      - name: Build frontend
        run: npm run build

      - name: Check Rust host
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Run Python tests
        shell: pwsh
        run: |
          $env:Path = "$(Resolve-Path python\.venv\Scripts);$env:Path"
          npm run test:python

      - name: Build Windows portable convenience binaries
        env:
          RECALL_SKIP_RUNTIME_SMOKE: "1"
        shell: pwsh
        run: |
          $env:Path = "$(Resolve-Path python\.venv\Scripts);$env:Path"
          python -c "import sys; print(sys.executable)"
          npx tauri build --no-bundle --ci --config '{"build":{"beforeBuildCommand":"npm run build"}}'
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          npm run package:portable

      - name: Sign optional release artifacts
        if: ${{ inputs.sign_artifacts }}
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_B64: ${{ secrets.WINDOWS_CERT_PFX_B64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERT_PFX_B64) { throw "Missing WINDOWS_CERT_PFX_B64 secret." }
          if (-not $env:WINDOWS_CERT_PASSWORD) { throw "Missing WINDOWS_CERT_PASSWORD secret." }
          $certPath = Join-Path $env:RUNNER_TEMP "recall-signing-cert.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_B64))
          $artifacts = @(
            "src-tauri\target\release\recall.exe"
          )
          foreach ($artifact in $artifacts) {
            if (-not (Test-Path $artifact)) {
              throw "Expected artifact not found for signing: $artifact"
            }
            signtool sign `
              /fd SHA256 `
              /td SHA256 `
              /tr http://timestamp.digicert.com `
              /f $certPath `
              /p $env:WINDOWS_CERT_PASSWORD `
              $artifact
          }

      - name: Generate checksums
        shell: pwsh
        run: |
          $artifacts = @(
            "src-tauri\target\release\portable\Recall_0.1.0-beta.3_portable-win64.zip"
          )
          $lines = @()
          foreach ($artifact in $artifacts) {
            if (-not (Test-Path $artifact)) {
              throw "Expected artifact not found for checksum generation: $artifact"
            }
            $hash = (Get-FileHash $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
            $lines += "$hash *$artifact"
          }
          Set-Content -Path "src-tauri\target\release\SHA256SUMS.txt" -Value $lines -Encoding utf8

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: recall-windows-release-artifacts
          path: |
            src-tauri/target/release/portable/Recall_0.1.0-beta.3_portable-win64.zip
            src-tauri/target/release/SHA256SUMS.txt
            src-tauri/resources/python-runtime-report.json

      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish_github_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.0-beta.3' }}
          name: Recall 0.1.0 Beta 3
          draft: true
          prerelease: true
          generate_release_notes: true
          overwrite_files: true
          files: |
            src-tauri/target/release/portable/Recall_0.1.0-beta.3_portable-win64.zip
            src-tauri/target/release/SHA256SUMS.txt
            src-tauri/resources/python-runtime-report.json
          body: |
            ## Recall 0.1.0 Beta 3

            This is a GitHub-first Windows testing release.

            Download the portable zip if you want to run Recall without cloning the developer workspace. Keep `recall.exe` and the bundled `python` folder together.

            Windows may show an unknown publisher warning because artifacts are unsigned in this beta release.
